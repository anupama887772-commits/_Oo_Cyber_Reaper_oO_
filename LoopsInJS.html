<!DOCTYPE html>
<html>
    <body>
        <h1>Loops in JavaScript</h1>
        <p id="demo"></p>


        <script>
            var fruits = ["Apple","Banana","Mango","Watermelon","Grapes","Green Apple"];
            var text ="";
            var i;
            for (i = 0 ; i < fruits.length; i++){
                text += fruits [i] + "<br>";
            }
            document.getElementById("demo").innerHTML = text;
        </script>
    </body>
</html>
