<!DOCTYPE HTML>
<html>
    <head>
        <title>My Food Menu.</title>
        <style>
            body {
                font-family:Arial;
                background:#fff0f0;
                padding=20px;
                text-align:center;
            }

            h1 {
                color:#065c00
            }

            h1+p {
                background:#ffe0b2;
                padding:10px 20px;
                border-radius:8px;
                color:#bf360c;
                display:inline-block;
            }

            ul {
                padding:0;
                margin-top:20px;
            }

            ul>li {
                list-style:none;
                font-size:10px;
                font-weight:bold;
                color:#5d4037;
                padding:10px 20px;
                margin:6px auto;
                width:260px;
                background:#fff3e0;
                border-radius:8px;
            }

            ul linth-child(3) {
                background:#ffe082;
                color:#e65c00;
            }

            .links {
                margin-top:25px;
            }

            a {
                color:#bf360c;
                text-decoration:none;
                font-size:15px;
            }
        </style>
    </head>
    <body>
        <h1>My Food Menu</h1>
        <p>Here is a list of my favorite foods:</p>
        <ul>
            <h2><li>Pizza</li></h2>
            <h2><li>Burgers</li></h2>
            <h2><li>Sushi -Chef's Special</li></h2>
            <h2><li>Pasta</li></h2>
            <h2><li>Ice Cream</li></h2>
        </ul>
        
        <p class="desc">Feel free to try any of these delicious options!</p>

        <div class="links">
            <a href="#">Order Now</a>
            <a href="#">See More</a>
        </div>
    </body>
</html>
