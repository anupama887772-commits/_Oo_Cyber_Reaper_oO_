<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Superhero Card</title>
    <style>
        body {
            background-color :darkcyan;
            color:white;
            font-family:Arial, sans-serif;
        }

        .hero-name {
            font-size: 60px;
            font-weight:bold;
            color:bisque;
            text-shadow:orangered;
        }

        .tagline {
            font-size: 24px;
            font-style: italic;
            color:bisque;
            text-transform:capitalize
        }

        .label {
            font-size:24 px;
            font-weight:bold;
            color:cyan;
            text-decoration:underline;
        }

        .power {
            font-weight:bold;
            color:red;
        }

        .weakness{
            font-style:italic;
            color:turquoise;
            text-decoration:underline;
        }

        .hero-title {
            font-size: 20px;
            font-weight:bold;
            color: red;
            text-align: center;
        }

        .footer {
            font-size: 14px;
            color:rgb(120,77,221);
            text-align:center;
        }
    </style>
</head>
<body>
    <h1 class="hero name">Invincible Man</h1>
    <p class="tagline">The most powerful hero in the world</p>

    <h2 class="label">Superpowers:</h2>
    <p class="power">Teleport to any place.</p>
    <p class="power">Can avoid any attacks.</p>
    <p class="power">He is invincible,immortal.</p>

    <h2 class="label">Weaknesses</h2>
    <p class="weaknesses">Vulnerable to Monster Beast.</p>
    <p class="weaknesses">Exhaustes quickly.</p>

    <h2 class="hero title">Worlds ultimate warrior</h2>

    <p class="footer">Created by :THE CODER CYBER_REAPER.</p>
</body>
