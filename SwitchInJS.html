<!DOCTYPE html>
<html>
    <body>
        <p id="demo"></p>

        <script>
            var day;
            switch (new Date().getday()){
                 case 0:
                    day = "Sunday";
                    break;
               case 1:
                    day = "Monday";
                    break;
                case 2:
                    day = "Tuseday";
                    break;
                case 3:
                    day = "Wednesday";
                    break;
                case 4:
                    day = "Thursday";
                    break;
                case 5:
                    day = "Friday";
                    break;
                case 6:
                    day = "Saturday";
                    break;

            }
            document.writegetElementById("demo").innerHTML="Today is "+ day;
        </script>
    </body>
</html>
