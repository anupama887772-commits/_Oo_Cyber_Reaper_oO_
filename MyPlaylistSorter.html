<!DOCTYPE html>
<html>
    <head>
        <title>My Playlist Sorter</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            body {
                background:lavender;
            }
            h1,h3 {
                color:darkviolet;
            }
            .box {
                background:white;
                color:darkviolet;
            }
        </style>
    </head>
    <body>
        <div class="container py-4">
            <h1 class="mb-1">My Playlist Sorter</h1>
            <p class="text-muted mb-4">Sort your playlist by title, artist, or album using JavaScript Array Methods!</p>

             <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Song Names</h3>
                    <button class="btn btn-primary mr-2" onclick="sortAZ()">Sort A to Z</button>
                    <button class="btn btn-primary mr-2" onclick="sortZA()">Sort Z to A</button>
                    <div id="nameResult" class="box p-3 nt-3 rounded"></div>
                </div>
             </div>

             <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Play counts</h3>
                    <button class="btn btn-primary mr-2" onclick="sortLeast()">Least played songs</button>
                    <button class="btn btn-primary mr-2" onclick="sortMost()">Most played songs</button>
                    <div id="playCountResult" class="box p-3 nt-3 rounded"></div>
                </div>  
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <h3 class="card-title">Label Every Play Count</h3>
                    <button class="btn btn-primary" onclick="addLabel()">Add Plays Label</button>
                    <div id="labelResult" class="box p-3 nt-3 rounded"></div>
                </div>
            </div>
        </div>
        <script>
           var songs = ["Monstagem Celestial Espranza" , "Montagem Elder" , "Montagem Nova" , "Montagem Alquima" , "Montagem Galactito"];
           var plays = [200,150,34,120,20];
           
           document.getElementById("nameResult").innerHTML = "Songs"+songs;
           document.getElementById("countResult").innerHTML = "Plays"+plays;
           document.getElementById("labelResult").innerHTML = "Press the button above";

           function sortAZ(){songs.sort(); document.getElementById("nameResult").innerHTML = "A to Z:"+songs;}
           function sortZA(){songs.sort(); songs.reverse(); document.getElementById("nameResult").innerHTML = "Z to A:"+songs;}
           function sortLeast(){plays.sort(function(a,b){return a-b}); document.getElementById("countResult").innerHTML = "Least played first:"+plays;}
            function sortMost() { plays.sort(function (a, b) { return b - a }); document.getElementById("countResult").innerHTML = "Most played first:" + plays; }
              function addLabel() { var labels = plays.map(function(c){return c+" plays: ";}); document.getElementById("labelResult").innerHTML = "Labelled"+1; }
              </script>
    </body>
</html>
