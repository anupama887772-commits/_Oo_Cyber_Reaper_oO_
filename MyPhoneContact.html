<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
    <title>My Phone Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color:#F8F8F2;
        }
        h1 {
            color:#FF5A43;
        }
        .card-label {
            font-size:11px;
            color:#999;
            text-trandform:uppercase;
        }
        pre {
            font-size:13px;
            color:#333;
        }
        </style>
</head>
<body class="py-4">
    <div class="container">
        <h1 class="mb-4">My Phone Contact</h1>
        <p class="text-muted mb-4">Introduction to Objects in JavaScript</p>
       
        <div class="card-shadow-sn mb-3" style="max-width:400px;">
            <div class="card-body">
                <h5 class="card-title" style="color:#FF5A43;">Contact Details</h5>

              <ul class="list-group list-group-flush">
                <li class="list-group-item">
                    <span class="card-label d-block">Name</span>
                    <strong id="name">CyberReaper</strong>
                <li class="list-group-item">
                    <span class="card-label d-block">Phone</span>
                    <strong id="phone">xxxxxxxxx</strong>
                </li>
                <li class="list-group-item">
                    <span class="card-label d-block">School</span>
                    <strong id="school">TMS</strong>
                </li>
                <li class="list-group-item">
                    <span class="card-label d-block">City</span>
                    <strong id="city">xxx</strong>
                </li>
            </ul>
         </div>
     </div>
    
     <div class="card shadow-sn" style="max-width-400px;">
        <div class="card-body">
            <h6 style="color:#FF5A43">JavaScript Object Used</h6>
            <pre id ="codeDisplay" class=""bg-light p-3 rounded border mb-0"></pre>
        </div>
    </div>
</div>
<script>
    var myContact = {
        name: "CyberReaper",
        phone: "xxxxxxxxx",
        school: "TMS",
        city: "xxx"
    };
    
    var nameEl=document.getElementById("name");
    var phoneEl = document.getElementById("phone");
    nameEl.textContent = myContact.name;
    phoneEl.textContent = myContact.phone;

    var schoolEl = document.getElementById("school");
    var cityEl = document.getElementById("city");
    schoolEl.textContent = myContact["school"];
    cityEl.textContent = myContact["city"];

    var codeEl = document.getElementById("codeDisplay");
    codeEl.textContent =
    'var myContact = {\n' +
    '    name: "CyberReaper",\n' +
    '    phone: "xxxxxxxxx",\n' +
    '    school: "TMS",\n' +
    '    city: "xxx"\n' +
    '};';

</script>
</body>
</html>
