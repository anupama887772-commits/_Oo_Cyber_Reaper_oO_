<!DOCTYPE html>
<html>
    <head>
        <title>My Animal Fact File</title>
        <style>
            body {
                background-color:darkgreen;
                font-family:Arial,sans-serif;
            }

            .fact-file {
                background-color:lightgreen;
                padding:25px;
                width:260px;
                margin:30px;
                color:greenyellow;
                border:4px solid forestgreen;
            }

            .animal-name {
                font-size:22px;
                color:darkgreen;
            }

            .detail {
                color:darkolivegreen;
            }

            .cool-fact {
                color:seagreen;
                font-style:oblique;
                font-weight:bold;
            }

            .fact-file-2 {
                background-color:rgb(255, 196, 107);
                padding:25px;
                width:260px;
                margin:30px;
                color:yellowgreen;
                border:4px solid darkorange;
            }

            .animal-name-2 {
                font-size:22px;
                color:rgb(255, 174, 0);
            }

            .detail-2 {
                color:rgb(209, 135, 25);
            }

            .cool-fact-2 {
                color:rgb(196, 143, 0);
                font-style:oblique;
                font-weight:bold;
            }
        </style>
    </head>
    <body>

        <div class="fact-file">
            <h2 class="animal-name">Elephant</h2>
            <p class="detail">Type: Big Mammals</p>
            <p class="detail">Habitat: Savanna</p>
            <p class="detail">Diet: Herbivore such as leaves,  grass, fruits etc.</p>
            <p class="cool-fact">Cool Fact: Elephants are the largest land animals on Earth!</p>
        </div>

        <div class="fact-file-2">
            <h2 class="animal-name-2">Lion</h2>
            <p class="detail-2">Type: White Lion</p>
            <p class="detail-2">Habitat: Hilly areas</p>
            <p class="detail-2">Diet: Carnivore such as meat of animals etc.</p>
            <p class="cool-fact-2">Cool Fact: Lions are the kings of the jungle!</p>
        </div>
    </body>
</html>
