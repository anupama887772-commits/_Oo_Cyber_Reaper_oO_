<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Variable</title>
</head>

<body>
    <h1>JavaScript Variable</h1>
    <p id="result"></p>

    <script>
        var x = 5;
        var y = 10;
        var sum = x + y;
        document.getElementById("result").innerHTML = "The value of sum is: " + sum;
        
    </script>
</body>
</html>
