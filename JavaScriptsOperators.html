<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Operators</title>
    </head>

    <body>
        <h2>Operators</h2>
        <p id="demo"></p>

        <script>
            //*use +, -, *,/operators*/
            var x = 5;
            var y = 6;
            var z = x + y;

            document.getElementById("demo").innerHTML = "The value of z is: " + z + ".";
        </script>
    </body>
</html>
