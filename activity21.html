<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Personal Detail Form</title>
</head>

<body bgcolor="#fff0ff">
    <h1>Personal Detail Form</h1>
    <form>
        <label>Name</label><br>
        <input type="text" id="name"><br><br>
        <label>Email-ID</label><br>
        <input type="text" id="email"><br><br>
        <label>Contact Number (You're contact would be hidden)</label><br>
        <input type="password" id="Contact Number"><br><br>
        <label>Gender :</label><br>
        <input type="radio" id="female" name="gender" value="Female">Female<br>
        <input type="radio" id="male" name="gender" value="Male">Male<br><br>
        <label>Favourite State</label><br>
        <input type="checkbox" id="state" value="Mumbai">Mumbai<br>
        <input type="checkbox" id="state" value="Punjab">Punjab<br><br>
        <input type="submit">
    </form>
</body>

</html>
